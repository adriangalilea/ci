# Verify + build + pack for a pnpm package, with read-only permissions. The
# packed tarball is what the caller's publish job uploads, so the job holding
# the npm OIDC token never installs dependencies or runs project code.
#
# Contract with the repo: package.json declares `packageManager` (pins pnpm)
# and a `verify` script, the whole gate (typecheck, lint, tests). The gate
# lives in the repo so `pnpm run verify` is the same thing locally and here.
#
# `release` is true on a push to the default branch whose version has no
# GitHub release yet. The release, not the npm upload, is the last step, so
# any run that died halfway is finished by the next push.
#
# A package inside a repo (`directory`, e-id's `cli/`) is built and packed
# there, after the repo's own install and a gate at its root: it builds against
# the repo's dependencies and types. Its tag carries `tag-prefix` (`cli-v0.1.0`)
# so it never reads as the repo's own release. Its gate can be a script of its
# own (`verify`, e-id's `verify:cli`) where the repo's whole gate cannot run in a
# keyless checkout (e-id commits its paid components sealed, opened only with a
# key its own deploy holds): the package is held to what it is made of.
name: node

on:
  workflow_call:
    inputs:
      directory:
        description: Where the package is, from the repo root.
        type: string
        default: .
      tag-prefix:
        description: Put before v<version> in the tag, e.g. "cli-". Lowercase letters and hyphens.
        type: string
        default: ''
      bun:
        description: Set up Bun, for a build script that runs it.
        type: boolean
        default: false
      verify:
        description: The root package.json script that is the gate.
        type: string
        default: verify
    outputs:
      tag:
        description: <tag-prefix>v<version> from the package's package.json.
        value: ${{ jobs.build.outputs.tag }}
      release:
        description: '"true" when this run must publish and release.'
        value: ${{ jobs.build.outputs.release }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.bun

      - name: Inputs
        env:
          DIR: ${{ inputs.directory }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          [[ "$PREFIX" =~ ^[a-z-]*$ ]] || { echo "::error::tag-prefix '$PREFIX' is not lowercase letters and hyphens"; exit 1; }
          [ -f "$DIR/package.json" ] || { echo "::error::no package.json in '$DIR'"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm run "$VERIFY"
        env:
          VERIFY: ${{ inputs.verify }}
      - run: pnpm run build
        working-directory: ${{ inputs.directory }}
      - run: pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist"
        working-directory: ${{ inputs.directory }}

      - name: Version
        id: version
        working-directory: ${{ inputs.directory }}
        env:
          PREFIX: ${{ inputs.tag-prefix }}
        run: echo "tag=${PREFIX}v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Release needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ON_DEFAULT: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [ "$ON_DEFAULT" != true ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> err; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' err; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            cat err; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.tgz
          if-no-files-found: error
