# Lint + build for a uv/hatchling package, with read-only permissions. The
# dist/ artifact is what the caller's publish job uploads, so the job holding
# the PyPI OIDC token never runs project code.
#
# Gate: `ruff check` + `ruff format --check`, with ruff from the project's
# `[dependency-groups] dev` (pyinit writes it there). Only that group is
# installed: ruff reads source, so the project's own dependencies (and
# whether they have wheels for this Python) never decide whether lint runs.
#
# `release` is true on a push to the default branch whose version has no
# GitHub release yet. The release, not the PyPI upload, is the last step, so
# any run that died halfway is finished by the next push.
name: python

on:
  workflow_call:
    outputs:
      tag:
        description: v<version> from pyproject.toml.
        value: ${{ jobs.build.outputs.tag }}
      release:
        description: '"true" when this run must publish and release.'
        value: ${{ jobs.build.outputs.release }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: uv run --only-group dev ruff check
      - run: uv run --only-group dev ruff format --check
      - run: uv build

      - name: Version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Release needed
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ON_DEFAULT: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [ "$ON_DEFAULT" != true ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> err; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' err; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            cat err; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
