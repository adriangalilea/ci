# The gate for a repo whose verbs live in mise.toml: `mise run check`, then
# the tree must be unchanged (check formats first, so a format-dirty commit
# fails here). Swift repos run it on macos-26; nothing here touches a secret.
name: mise

on:
  workflow_call:
    inputs:
      runner:
        description: Runner for the check. Must satisfy the package's platforms.
        type: string
        default: macos-26

permissions: {}

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run check
      - run: git diff --exit-code
