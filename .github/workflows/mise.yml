# The gate for a repo whose verbs live in mise.toml: `mise run check` (or the
# task the caller names), then the tree must be unchanged (check formats first,
# so a format-dirty commit fails here). Swift repos run it on macos-26; nothing
# here touches a secret.
#
# A caller splits a slow gate into parallel jobs by calling this once per task
# (check, then `platforms iOS`, `platforms tvOS`): the wall time is the slowest
# job, not the sum. `cache` keeps a build directory between runs, so a push
# that touches one module recompiles that module: restored from the newest run
# of the same task, saved under this commit.
name: mise

on:
  workflow_call:
    inputs:
      runner:
        description: Runner for the task. Must satisfy the package's platforms.
        type: string
        default: macos-26
      task:
        description: The mise task to run, with its arguments, e.g. "platforms iOS".
        type: string
        default: check
      cache:
        description: A build directory kept between runs (e.g. .build), restored before the task. None when empty.
        type: string
        default: ''

permissions: {}

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      # A self-hosted runner keeps its build directory where the last run left
      # it: the checkout cleans nothing ignored, and GitHub's cache is never
      # used (restoring a build of hundreds of MB over the network took longer
      # than building). Only GitHub's own machines go through the cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
          # The history the file times below are read from.
          fetch-depth: ${{ inputs.cache != '' && runner.environment == 'github-hosted' && 0 || 1 }}
      # A checkout stamps every file with the time of the checkout, so a build
      # tool comparing times sees every file as new and the cached build is
      # thrown away whole. Each file gets the time of the last commit that
      # touched it instead: unchanged files stay older than their cached
      # products, and only what the push touched is rebuilt. (A kept checkout
      # rewrites only the files a push changed, so it needs none of this.)
      - if: inputs.cache != '' && runner.environment == 'github-hosted'
        name: File times from git
        run: |
          git log --format='%ct' --name-only | perl -ne '
            chomp;
            if (/^\d+$/) { $t = $_; next }
            next if $_ eq "" or $seen{$_}++;
            utime $t, $t, $_ if -e $_;
          '
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Its tools cache is 800 MB: a self-hosted runner keeps its tools
          # installed, and downloading them took longer than the build.
          cache: ${{ runner.environment == 'github-hosted' }}
      - if: inputs.cache != '' && runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache }}
          key: mise-${{ runner.os }}-${{ inputs.task }}-${{ github.sha }}
          restore-keys: mise-${{ runner.os }}-${{ inputs.task }}-
      - env:
          TASK: ${{ inputs.task }}
        run: |
          read -ra ARGS <<< "$TASK"
          mise run "${ARGS[@]}"
      - run: git diff --exit-code
