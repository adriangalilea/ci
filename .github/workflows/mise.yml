# The gate for a repo whose verbs live in mise.toml: `mise run check` (or the
# task the caller names), then the tree must be unchanged (check formats first,
# so a format-dirty commit fails here). Swift repos run it on macos-26; nothing
# here touches a secret.
#
# A caller splits a slow gate into parallel jobs by calling this once per task
# (check, then `platforms iOS`, `platforms tvOS`): the wall time is the slowest
# job, not the sum. `cache` keeps a build directory between runs, so a push
# that touches one module recompiles that module: restored from the newest run
# of the same task, saved under this commit.
name: mise

on:
  workflow_call:
    inputs:
      runner:
        description: Runner for the task. Must satisfy the package's platforms.
        type: string
        default: macos-26
      task:
        description: The mise task to run, with its arguments, e.g. "platforms iOS".
        type: string
        default: check
      cache:
        description: A build directory kept between runs (e.g. .build), restored before the task. None when empty.
        type: string
        default: ''

permissions: {}

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - if: inputs.cache != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache }}
          key: mise-${{ runner.os }}-${{ inputs.task }}-${{ github.sha }}
          restore-keys: mise-${{ runner.os }}-${{ inputs.task }}-
      - env:
          TASK: ${{ inputs.task }}
        run: |
          read -ra ARGS <<< "$TASK"
          mise run "${ARGS[@]}"
      - run: git diff --exit-code
