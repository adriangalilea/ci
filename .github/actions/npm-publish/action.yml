name: npm-publish
description: Publish the tarball node.yml packed, from the caller's own publish job, through npm trusted publishing.

# A composite action runs inside the caller's job, so the OIDC token npm checks
# still names the caller's workflow file and environment. That is why this is an
# action and not a reusable workflow.
#
# npm's refusal to publish over a published version counts as published: right
# after a version goes up (by hand, or from a run that died before its release),
# `npm view` can answer 404 for minutes, so asking first races the registry.
# A staged version waiting for approval is not published, and fails the job.

inputs:
  artifact:
    description: Name of the artifact holding the tarball (node.yml's `artifact` input).
    default: dist

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/npm-publish
    - name: Publish
      shell: bash
      working-directory: ${{ runner.temp }}/npm-publish
      run: |
        # ./ is load-bearing: npm reads `x.tgz` without it as a GitHub repo.
        TGZ=$(echo ./*.tgz)
        NAME=$(tar -xOzf "$TGZ" package/package.json | jq -r .name)
        VERSION=$(tar -xOzf "$TGZ" package/package.json | jq -r .version)
        if OUT=$(npm publish "$TGZ" --access public 2>&1); then
          echo "$OUT"
          exit 0
        fi
        echo "$OUT"
        grep -q "cannot publish over the previously published versions" <<< "$OUT" || exit 1
        echo "::notice::$NAME@$VERSION was already on npm"
